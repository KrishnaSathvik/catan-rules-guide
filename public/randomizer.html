<script>
// ═══ CATAN MAP RANDOMIZER ENGINE ═══

const TERRAIN = {
  forest:  {color:'#5a9c3c',stroke:'#3a6a22',icon:'🌲',resource:'Lumber'},
  pasture: {color:'#8bc34a',stroke:'#5a8a28',icon:'🐑',resource:'Wool'},
  fields:  {color:'#e8b830',stroke:'#b89010',icon:'🌾',resource:'Grain'},
  hills:   {color:'#c45a3c',stroke:'#8a3520',icon:'🧱',resource:'Brick'},
  mountains:{color:'#808090',stroke:'#505060',icon:'⛰️',resource:'Ore'},
  desert:  {color:'#d4b87a',stroke:'#a89050',icon:'🏜️',resource:'None'},
};

// Pip counts for probability display
const PIPS = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};

// Resource importance weights based on usage frequency in Catan.
// Grain is used in settlements, cities, and dev cards (3 of 4 build actions).
// Ore is needed for cities and dev cards. Brick/Lumber are early-game only.
const RESOURCE_WEIGHTS = {
  fields: 1.25,     // Grain
  mountains: 1.15,  // Ore
  hills: 1.0,       // Brick
  forest: 1.0,      // Lumber
  pasture: 0.9,     // Wool
};

// Base game (19 hexes)
const BASE_TERRAINS = ['forest','forest','forest','forest','pasture','pasture','pasture','pasture','fields','fields','fields','fields','hills','hills','hills','mountains','mountains','mountains','desert'];
const BASE_NUMBERS = [2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];

// 5-6 player expansion (30 hexes)
const EXP_TERRAINS = ['forest','forest','forest','forest','forest','forest','pasture','pasture','pasture','pasture','pasture','pasture','fields','fields','fields','fields','fields','fields','hills','hills','hills','hills','hills','mountains','mountains','mountains','mountains','mountains','desert','desert'];
const EXP_NUMBERS = [2,2,3,3,3,4,4,4,5,5,5,6,6,6,8,8,8,9,9,9,10,10,10,11,11,11,12,12];

// Port pools
const BASE_PORTS = ['3:1','3:1','3:1','3:1','lumber 2:1','wool 2:1','grain 2:1','brick 2:1','ore 2:1'];
const EXP_PORTS = ['3:1','3:1','3:1','3:1','3:1','3:1','lumber 2:1','wool 2:1','grain 2:1','brick 2:1','ore 2:1'];

const PORT_STYLES = {
  '3:1':       { bg:'#e8d8b0', text:'#5a5040', label:'3:1' },
  'lumber 2:1':{ bg:'#6aaf4c', text:'#fff',    label:'2:1 \u{1F332}' },
  'wool 2:1':  { bg:'#a8d860', text:'#fff',    label:'2:1 \u{1F411}' },
  'grain 2:1': { bg:'#f2d04a', text:'#5a4010', label:'2:1 \u{1F33E}' },
  'brick 2:1': { bg:'#d87050', text:'#fff',    label:'2:1 \u{1F9F1}' },
  'ore 2:1':   { bg:'#9898aa', text:'#fff',    label:'2:1 \u26F0\uFE0F' },
};

// Hex grid layouts using axial coordinates [q, r]
const BASE_HEXES = [
  [-2,0],[-2,1],[-2,2],
  [-1,-1],[-1,0],[-1,1],[-1,2],
  [0,-2],[0,-1],[0,0],[0,1],[0,2],
  [1,-2],[1,-1],[1,0],[1,1],
  [2,-2],[2,-1],[2,0]
];

const EXP_HEXES = [
  [-3,0],[-3,1],[-3,2],[-3,3],
  [-2,-1],[-2,0],[-2,1],[-2,2],[-2,3],
  [-1,-2],[-1,-1],[-1,0],[-1,1],[-1,2],[-1,3],
  [0,-3],[0,-2],[0,-1],[0,0],[0,1],[0,2],
  [1,-3],[1,-2],[1,-1],[1,0],[1,1],
  [2,-3],[2,-2],[2,-1],[2,0]
];

let mode = 4;
let currentBoard = null;
let currentPorts = null;
let lastGenerateUsedFallback = false;

function setMode(m) {
  mode = m;
  document.getElementById('btn4').classList.toggle('active', m===4);
  document.getElementById('btn6').classList.toggle('active', m===6);
  generate();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function axialToPixel(q, r, size) {
  const x = size * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r);
  const y = size * (3/2 * r);
  return {x, y};
}

function getNeighbors(q, r) {
  return [[q+1,r],[q-1,r],[q,r+1],[q,r-1],[q+1,r-1],[q-1,r+1]];
}

function hexKey(q,r) { return q+','+r; }

// ═══ VERTEX ANALYSIS ═══
// Each vertex is the meeting point of up to 3 hexes (settlement spot).
// In axial coords, a hex (q,r) has 6 vertices, each shared by a triple of hexes.
// We enumerate unique vertices by canonical sorted triples.

function getVertices(board) {
  const boardKeys = new Set(Object.keys(board));
  const vertexMap = {};

  const vertexTriples = (q, r) => [
    [[q,r],[q+1,r-1],[q+1,r]],
    [[q,r],[q+1,r],[q,r+1]],
    [[q,r],[q,r+1],[q-1,r+1]],
    [[q,r],[q-1,r+1],[q-1,r]],
    [[q,r],[q-1,r],[q,r-1]],
    [[q,r],[q,r-1],[q+1,r-1]],
  ];

  for (const key in board) {
    const hex = board[key];
    const triples = vertexTriples(hex.q, hex.r);
    for (const triple of triples) {
      const sorted = triple.map(([q,r]) => hexKey(q,r)).sort();
      const vKey = sorted.join('|');
      if (vertexMap[vKey]) continue;

      const onBoard = triple
        .map(([q,r]) => ({key: hexKey(q,r), q, r}))
        .filter(h => boardKeys.has(h.key));

      if (onBoard.length < 2) continue;

      let pips = 0;
      const resources = [];
      for (const h of onBoard) {
        const bh = board[h.key];
        if (bh.terrain !== 'desert' && bh.number) {
          pips += PIPS[bh.number] || 0;
          resources.push(bh.terrain);
        }
      }

      vertexMap[vKey] = {
        hexes: onBoard,
        pips,
        resources,
        resourceCount: new Set(resources).size,
      };
    }
  }
  return Object.values(vertexMap);
}

function calcVertexScore(board) {
  const vertices = getVertices(board);
  if (vertices.length === 0) return { spread: 0, min: 0, max: 0, avg: 0, deadZones: 0, diverseVertices: 0, total: 0, vertices };

  const pipValues = vertices.map(v => v.pips);
  const min = Math.min(...pipValues);
  const max = Math.max(...pipValues);
  const avg = pipValues.reduce((a,b) => a+b, 0) / pipValues.length;
  const variance = pipValues.reduce((a,v) => a + Math.pow(v - avg, 2), 0) / pipValues.length;

  // Dead zones: vertices touching 3 hexes but with very low pips (<=3)
  const deadZones = vertices.filter(v => v.hexes.length >= 3 && v.pips <= 3).length;
  // Resource diversity: vertices offering 3 different resources
  const diverseVertices = vertices.filter(v => v.resourceCount >= 3).length;

  return { spread: variance, min, max, avg, deadZones, diverseVertices, total: vertices.length, vertices };
}

function getPortPositions(hexCoords, count) {
  const hexSet = new Set(hexCoords.map(([q,r]) => hexKey(q,r)));
  // Collect all coast edges with land-neighbor counts for the water hex
  const allEdges = [];
  const size = 1; // unit size; we only need relative geometry
  hexCoords.forEach(([q,r]) => {
    const neighbors = getNeighbors(q,r);
    for (let dir = 0; dir < 6; dir++) {
      const [nq,nr] = neighbors[dir];
      if (!hexSet.has(hexKey(nq,nr))) {
        const waterNeighbors = getNeighbors(nq, nr);
        const landCount = waterNeighbors.filter(([wq,wr]) => hexSet.has(hexKey(wq,wr))).length;
        const center = axialToPixel(q,r,size);
        const a1 = Math.PI/180*(60*dir - 30);
        const a2 = Math.PI/180*(60*((dir+1)%6) - 30);
        const mx = center.x + size*(Math.cos(a1)+Math.cos(a2))/2;
        const my = center.y + size*(Math.sin(a1)+Math.sin(a2))/2;
        allEdges.push({q, r, dir, mx, my, landCount});
      }
    }
  });
  // Prefer outer edges (water hex has fewer land neighbors)
  // Use strictest filter that still provides enough edges for ports
  let coastEdges = allEdges.filter(e => e.landCount < 3);
  if (coastEdges.length < count * 2) coastEdges = allEdges.filter(e => e.landCount < 4);
  if (coastEdges.length < count * 2) coastEdges = allEdges;
  // Sort clockwise by angle from board center
  const avgX = coastEdges.reduce((s,e)=>s+e.mx,0)/coastEdges.length;
  const avgY = coastEdges.reduce((s,e)=>s+e.my,0)/coastEdges.length;
  coastEdges.sort((a,b) => {
    const aa = Math.atan2(a.my - avgY, a.mx - avgX);
    const ab = Math.atan2(b.my - avgY, b.mx - avgX);
    return aa - ab;
  });
  // Evenly pick count positions
  const total = coastEdges.length;
  const picked = [];
  for (let i = 0; i < count; i++) {
    picked.push(coastEdges[Math.floor(i * total / count)]);
  }
  return picked;
}

// Backtracking terrain placement — guarantees no adjacent same terrain
function placeTerrainsBT(hexCoords, terrainPool) {
  const counts = {};
  terrainPool.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
  const types = Object.keys(counts);
  const placed = {}; // hexKey -> terrain

  function backtrack(idx) {
    if (idx === hexCoords.length) return true;
    const [q, r] = hexCoords[idx];
    const key = hexKey(q, r);

    const shuffled = shuffle(types.filter(t => counts[t] > 0));
    for (const terrain of shuffled) {
      if (terrain !== 'desert') {
        let conflict = false;
        for (const [nq, nr] of getNeighbors(q, r)) {
          const nk = hexKey(nq, nr);
          if (placed[nk] && placed[nk] !== 'desert' && placed[nk] === terrain) {
            conflict = true; break;
          }
        }
        if (conflict) continue;
      }
      placed[key] = terrain;
      counts[terrain]--;
      if (backtrack(idx + 1)) return true;
      delete placed[key];
      counts[terrain]++;
    }
    return false;
  }

  if (backtrack(0)) {
    return hexCoords.map(([q, r]) => placed[hexKey(q, r)]);
  }
  return null;
}

// Backtracking number placement — guarantees no adjacent same/red/low numbers
function placeNumbersBT(nonDesertCoords, numberPool, hexSet, opts) {
  const coords = shuffle(nonDesertCoords);
  const counts = {};
  numberPool.forEach(n => { counts[n] = (counts[n] || 0) + 1; });
  const nums = Object.keys(counts).map(Number);
  const placed = {}; // hexKey -> number
  let nodes = 0;
  const nodeLimit = 50000;

  function conflicts(q, r, num) {
    for (const [nq, nr] of getNeighbors(q, r)) {
      const nk = hexKey(nq, nr);
      if (!(nk in placed)) continue;
      if (!hexSet.has(nk)) continue;
      const nn = placed[nk];
      if (opts.noSameNumAdj && num === nn) return true;
      if (opts.noRedAdj && [6,8].includes(num) && [6,8].includes(nn)) return true;
      if (opts.noLowAdj && [2,12].includes(num) && [2,12].includes(nn)) return true;
    }
    return false;
  }

  function backtrack(idx) {
    if (++nodes > nodeLimit) return false;
    if (idx === coords.length) return true;
    const [q, r] = coords[idx];
    const key = hexKey(q, r);
    const shuffled = shuffle(nums.filter(n => counts[n] > 0));
    for (const num of shuffled) {
      if (conflicts(q, r, num)) continue;
      placed[key] = num;
      counts[num]--;
      if (backtrack(idx + 1)) return true;
      delete placed[key];
      counts[num]++;
    }
    return false;
  }

  if (backtrack(0)) {
    return placed;
  }
  return null;
}

function generateBoard() {
  const hexCoords = mode === 4 ? BASE_HEXES : EXP_HEXES;
  const terrainPool = mode === 4 ? BASE_TERRAINS : EXP_TERRAINS;
  const numberPool = mode === 4 ? BASE_NUMBERS : EXP_NUMBERS;

  const noRedAdj = document.getElementById('chkRed').checked;
  const noSameNumAdj = document.getElementById('chkSameNum').checked;
  const noTerrainAdj = document.getElementById('chkTerrain').checked;
  const noLowAdj = document.getElementById('chkLowAdj').checked;
  const needNumBT = noRedAdj || noSameNumAdj || noLowAdj;

  let best = null;
  let bestScore = Infinity;

  const maxAttempts = hexCoords.length > 20 ? 500 : 200;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    // Phase 1: Place terrains
    const terrains = noTerrainAdj ? placeTerrainsBT(hexCoords, terrainPool) : shuffle(terrainPool);
    if (!terrains) break;

    const board = {};
    hexCoords.forEach((coord, i) => {
      board[hexKey(coord[0],coord[1])] = { q:coord[0], r:coord[1], terrain:terrains[i], number:null };
    });

    // Phase 2: Assign numbers to non-desert hexes
    const nonDesert = hexCoords.filter((c,i) => terrains[i] !== 'desert');
    const hexSet = new Set(nonDesert.map(([q,r]) => hexKey(q,r)));
    if (needNumBT) {
      const numMap = placeNumbersBT(nonDesert, numberPool, hexSet, {noRedAdj, noSameNumAdj, noLowAdj});
      if (!numMap) continue; // backtrack failed for this ordering, try another
      nonDesert.forEach(([q,r]) => {
        board[hexKey(q,r)].number = numMap[hexKey(q,r)];
      });
    } else {
      const numbers = shuffle(numberPool).slice(0, nonDesert.length);
      nonDesert.forEach((coord, i) => {
        board[hexKey(coord[0],coord[1])].number = numbers[i];
      });
    }

    const scoreObj = calcBalanceScore(board);
    if (scoreObj.total < bestScore) {
      bestScore = scoreObj.total;
      best = JSON.parse(JSON.stringify(board));
    }
    if (attempt > 50 && best) break;
  }

  if (!best) {
    lastGenerateUsedFallback = true;
    return generateFallback(hexCoords, terrainPool, numberPool);
  }
  lastGenerateUsedFallback = false;
  return best;
}

function generateFallback(hexCoords, terrainPool, numberPool) {
  const terrains = shuffle(terrainPool);
  const board = {};
  hexCoords.forEach((coord, i) => {
    board[hexKey(coord[0],coord[1])] = { q:coord[0], r:coord[1], terrain:terrains[i], number:null };
  });
  const nonDesert = hexCoords.filter((c,i) => terrains[i] !== 'desert');
  const numbers = shuffle(numberPool).slice(0, nonDesert.length);
  nonDesert.forEach((coord, i) => {
    board[hexKey(coord[0],coord[1])].number = numbers[i];
  });
  return board;
}

function generatePorts(hexCoords, portPool) {
  const positions = getPortPositions(hexCoords, portPool.length);
  const types = shuffle([...portPool]);
  return positions.map((pos, i) => ({ ...pos, type: types[i] }));
}

function calcBalanceScore(board) {
  const useWeights = document.getElementById('chkWeighted').checked;

  // Component 1: Resource pip variance
  const resourcePips = {};
  for (const key in board) {
    const hex = board[key];
    if (hex.terrain === 'desert' || !hex.number) continue;
    const res = hex.terrain;
    if (!resourcePips[res]) resourcePips[res] = 0;
    const weight = useWeights ? (RESOURCE_WEIGHTS[res] || 1.0) : 1.0;
    resourcePips[res] += (PIPS[hex.number] || 0) * weight;
  }
  const values = Object.values(resourcePips);
  if (values.length === 0) return { total: 100, resourceVariance: 100, vertexSpread: 0, resourcePips };
  const avg = values.reduce((a,b) => a+b, 0) / values.length;
  const resourceVariance = values.reduce((a,v) => a + Math.pow(v - avg, 2), 0) / values.length;

  // Component 2: Vertex pip spread (normalized to similar scale)
  const vertexData = calcVertexScore(board);
  const vertexSpread = vertexData.spread / 3;

  // Composite: 65% resource balance, 35% vertex balance
  const total = resourceVariance * 0.65 + vertexSpread * 0.35;

  return { total, resourceVariance, vertexSpread: vertexData.spread, vertexData, resourcePips };
}

function getBalanceLabel(score) {
  const s = typeof score === 'object' ? score.total : score;
  if (s < 2) return {text:'Excellent', cls:'score-great'};
  if (s < 4) return {text:'Good', cls:'score-good'};
  if (s < 6) return {text:'Fair', cls:'score-ok'};
  return {text:'Unbalanced', cls:'score-bad'};
}

function hexPoints(cx, cy, s) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push(`${cx + s * Math.cos(a)},${cy + s * Math.sin(a)}`);
  }
  return pts.join(' ');
}

function renderBoard(board, ports) {
  const size = mode === 4 ? 50 : 38;
  const hexes = Object.values(board);
  const hexSet = new Set(Object.keys(board));

  // Calculate bounds
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  hexes.forEach(h => {
    const p = axialToPixel(h.q, h.r, size);
    minX = Math.min(minX, p.x - size * 1.2);
    maxX = Math.max(maxX, p.x + size * 1.2);
    minY = Math.min(minY, p.y - size * 1.2);
    maxY = Math.max(maxY, p.y + size * 1.2);
  });

  const pad = size * 2.0;
  const w = maxX - minX + pad*2;
  const h2 = maxY - minY + pad*2;
  const offX = -minX + pad;
  const offY = -minY + pad;

  let svg = `<svg viewBox="0 0 ${w.toFixed(1)} ${h2.toFixed(1)}" width="${Math.min(w, 800).toFixed(0)}" xmlns="http://www.w3.org/2000/svg">`;

  // ── Defs: gradients, filters ──
  svg += `<defs>`;
  // Ocean gradient
  svg += `<radialGradient id="seaGrad" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#4aa3d4"/>
    <stop offset="60%" stop-color="#2a7ab5"/>
    <stop offset="100%" stop-color="#1a4a6a"/>
  </radialGradient>`;
  // Terrain gradients
  const grads = {
    forest:['#6aaf4c','#3d7a28'],pasture:['#a8d860','#72a830'],fields:['#f2d04a','#c8a018'],
    hills:['#d87050','#a04028'],mountains:['#9898aa','#5a5a6a'],desert:['#e8d0a0','#c0a868']
  };
  Object.entries(grads).forEach(([n,[c1,c2]]) => {
    svg += `<linearGradient id="tg_${n}" x1="0%" y1="0%" x2="40%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient>`;
  });
  // Token shadow
  svg += `<filter id="tkSh"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/></filter>`;
  // Token radial for cream look
  svg += `<radialGradient id="tokenFill" cx="45%" cy="40%" r="55%"><stop offset="0%" stop-color="#fef8e8"/><stop offset="100%" stop-color="#e8d8b0"/></radialGradient>`;
  svg += `</defs>`;

  // ── Ocean background ──
  svg += `<rect width="${w.toFixed(1)}" height="${h2.toFixed(1)}" rx="20" fill="url(#seaGrad)"/>`;

  // ── Water hex ring: draw blue hexes in empty neighbor slots ──
  const waterSlots = new Set();
  hexes.forEach(h => {
    getNeighbors(h.q, h.r).forEach(([nq,nr]) => {
      const k = hexKey(nq,nr);
      if (!hexSet.has(k)) waterSlots.add(k);
    });
  });
  waterSlots.forEach(k => {
    const [q,r] = k.split(',').map(Number);
    const p = axialToPixel(q, r, size);
    const cx = p.x + offX, cy = p.y + offY;
    svg += `<polygon points="${hexPoints(cx,cy,size)}" fill="#2a80b0" opacity="0.25" stroke="#2a80b0" stroke-width="1" stroke-opacity="0.3"/>`;
  });

  // ── Coast outline: thicker border on island edge ──
  hexes.forEach(hex => {
    const p = axialToPixel(hex.q, hex.r, size);
    const cx = p.x + offX, cy = p.y + offY;
    const neighbors = getNeighbors(hex.q, hex.r);
    for (let i = 0; i < 6; i++) {
      const [nq, nr] = neighbors[i];
      if (!hexSet.has(hexKey(nq,nr))) {
        // This edge borders water — draw a sandy coast edge
        const a1 = Math.PI / 180 * (60 * i - 30);
        const a2 = Math.PI / 180 * (60 * ((i+1)%6) - 30);
        const x1 = cx + size * Math.cos(a1), y1 = cy + size * Math.sin(a1);
        const x2 = cx + size * Math.cos(a2), y2 = cy + size * Math.sin(a2);
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d4a850" stroke-width="3.5" stroke-linecap="round"/>`;
      }
    }
  });

  // ── Terrain hexes ──
  hexes.forEach(hex => {
    const p = axialToPixel(hex.q, hex.r, size);
    const cx = p.x + offX, cy = p.y + offY;
    const t = TERRAIN[hex.terrain];

    svg += `<polygon points="${hexPoints(cx,cy,size)}" fill="url(#tg_${hex.terrain})" stroke="${t.stroke}" stroke-width="1.5"/>`;

    // Terrain illustration (SVG icons)
    const iconScale = size * 0.028;
    const iconY = hex.number ? cy - size*0.22 : cy - size*0.05;
    svg += `<g transform="translate(${cx},${iconY}) scale(${iconScale})">${terrainIconSVG(hex.terrain)}</g>`;

    // Number token
    if (hex.number) {
      const tokY = cy + size*0.26;
      const tokR = size * 0.32;
      const isRed = [6,8].includes(hex.number);

      // Token circle with shadow
      svg += `<circle cx="${cx}" cy="${tokY}" r="${tokR}" fill="url(#tokenFill)" filter="url(#tkSh)"/>`;
      svg += `<circle cx="${cx}" cy="${tokY}" r="${tokR}" fill="none" stroke="#c0a050" stroke-width="0.8" opacity="0.5"/>`;

      // Number
      const fontSize = tokR * 1.15;
      svg += `<text x="${cx}" y="${tokY}" text-anchor="middle" dominant-baseline="central" font-size="${fontSize}" font-weight="700" fill="${isRed ? '#c0392b' : '#2a2520'}" font-family="'Crimson Pro',serif">${hex.number}</text>`;

      // Pip dots
      const pips = PIPS[hex.number] || 0;
      const dotY = tokY + tokR * 0.62;
      const dotSpacing = size * 0.09;
      const dotStart = cx - (pips-1)*dotSpacing/2;
      for (let d=0; d<pips; d++) {
        svg += `<circle cx="${dotStart + d*dotSpacing}" cy="${dotY}" r="${size*0.035}" fill="${isRed ? '#c0392b' : '#6a6560'}"/>`;
      }
    }

    // Desert — robber piece
    if (hex.terrain === 'desert' && !hex.number) {
      const rY = cy + size*0.3;
      const rs = size * 0.06;
      svg += `<circle cx="${cx}" cy="${rY - rs*3}" r="${rs*1.8}" fill="rgba(40,30,20,0.35)"/>`;
      svg += `<path d="M${cx-rs*1.5},${rY} L${cx-rs*1.2},${rY-rs*1.5} Q${cx},${rY-rs*2.5} ${cx+rs*1.2},${rY-rs*1.5} L${cx+rs*1.5},${rY}Z" fill="rgba(40,30,20,0.35)"/>`;
    }
  });

  // ── Ports (drawn last so they appear on top of terrain hexes) ──
  if (ports && ports.length) {
    ports.forEach(port => {
      // Place badge at the center of the adjacent water hex (guaranteed outside island)
      const waterNeighbor = getNeighbors(port.q, port.r)[port.dir];
      const waterPos = axialToPixel(waterNeighbor[0], waterNeighbor[1], size);
      const bx = waterPos.x + offX, by = waterPos.y + offY;
      const style = PORT_STYLES[port.type];
      const bw = size*0.7, bh = size*0.4, br = size*0.12;
      svg += `<rect x="${bx - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="${br}" fill="${style.bg}" stroke="#8a7a5a" stroke-width="1" filter="url(#tkSh)"/>`;
      const fontSize = size*0.22;
      svg += `<text x="${bx}" y="${by}" text-anchor="middle" dominant-baseline="central" font-size="${fontSize}" font-weight="700" fill="${style.text}" font-family="'DM Sans',sans-serif">${style.label}</text>`;
    });
  }

  svg += '</svg>';
  return svg;
}

function renderStats(board) {
  const resourcePips = {};
  const resourceCounts = {};
  const allResources = ['forest','pasture','fields','hills','mountains'];
  
  allResources.forEach(r => { resourcePips[r] = 0; resourceCounts[r] = 0; });
  
  for (const key in board) {
    const hex = board[key];
    if (hex.terrain === 'desert' || !hex.number) continue;
    resourcePips[hex.terrain] += PIPS[hex.number] || 0;
    resourceCounts[hex.terrain]++;
  }
  
  const maxPips = Math.max(...Object.values(resourcePips), 1);
  
  let html = '';
  allResources.forEach(res => {
    const t = TERRAIN[res];
    const pips = resourcePips[res];
    const pct = ((pips / maxPips) * 100).toFixed(0);
    html += `<div class="stat-card">
      <div class="stat-icon">${t.icon}</div>
      <div class="stat-name">${t.resource}</div>
      <div class="stat-value">${pips} pips</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%;background:${t.color};"></div></div>
    </div>`;
  });
  return html;
}

function renderVertexStats(board) {
  const vs = calcVertexScore(board);
  if (vs.total === 0) return '';

  const el = document.createElement('div');

  const h3 = document.createElement('h3');
  h3.textContent = 'Settlement Spot Analysis';
  el.appendChild(h3);

  const grid = document.createElement('div');
  grid.className = 'vertex-grid';

  const items = [
    {label: 'Best Spot', value: vs.max + ' pips', warn: false},
    {label: 'Worst Spot', value: vs.min + ' pips', warn: vs.min <= 2},
    {label: 'Average', value: vs.avg.toFixed(1) + ' pips', warn: false},
    {label: 'Weak Spots', value: String(vs.deadZones), warn: vs.deadZones > 0},
    {label: 'Diverse Spots', value: String(vs.diverseVertices), warn: false},
  ];

  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'vertex-stat';
    const lbl = document.createElement('div');
    lbl.className = 'vs-label';
    lbl.textContent = item.label;
    const val = document.createElement('div');
    val.className = 'vs-value' + (item.warn ? ' vs-warn' : '');
    val.textContent = item.value;
    card.appendChild(lbl);
    card.appendChild(val);
    grid.appendChild(card);
  }

  el.appendChild(grid);
  return el.innerHTML;
}

function analyzePortProximity(board, ports) {
  if (!ports || !ports.length) return [];
  const terrainMap = {lumber:'forest', wool:'pasture', grain:'fields', brick:'hills', ore:'mountains'};
  const results = [];
  for (const port of ports) {
    if (port.type === '3:1') continue;
    const resourceType = port.type.split(' ')[0];
    const terrain = terrainMap[resourceType];
    if (!terrain) continue;

    const attachedHex = board[hexKey(port.q, port.r)];
    const neighbors = getNeighbors(port.q, port.r);
    const nearbyHexes = [attachedHex, ...neighbors.map(function(n) { return board[hexKey(n[0],n[1])]; })].filter(Boolean);
    const matchingNearby = nearbyHexes.filter(function(h) { return h.terrain === terrain; });
    const bestPips = matchingNearby.length > 0
      ? Math.max.apply(null, matchingNearby.map(function(h) { return PIPS[h.number] || 0; }))
      : 0;

    results.push({
      port: port.type,
      resourceType: resourceType,
      terrain: terrain,
      matchingNearby: matchingNearby.length,
      bestPips: bestPips,
      useful: matchingNearby.length > 0 && bestPips >= 3,
    });
  }
  return results;
}

function generate() {
  const board = generateBoard();
  currentBoard = board;
  const hexCoords = mode === 4 ? BASE_HEXES : EXP_HEXES;
  const portPool = mode === 4 ? BASE_PORTS : EXP_PORTS;
  currentPorts = generatePorts(hexCoords, portPool);

  document.getElementById('boardContainer').innerHTML = renderBoard(board, currentPorts);
  document.getElementById('stats').innerHTML = renderStats(board);
  document.getElementById('vertexStats').innerHTML = renderVertexStats(board);

  const score = calcBalanceScore(board);
  const label = getBalanceLabel(score);
  const balanceEl = document.getElementById('balanceScore');
  balanceEl.textContent = '';

  const labelSpan = document.createElement('span');
  labelSpan.className = 'label';
  labelSpan.textContent = 'Balance Score: ';
  balanceEl.appendChild(labelSpan);

  const scoreSpan = document.createElement('span');
  scoreSpan.className = 'score ' + label.cls;
  scoreSpan.textContent = label.text;
  balanceEl.appendChild(scoreSpan);

  // Dice disclaimer tooltip
  const tip = document.createElement('span');
  tip.className = 'balance-tip';
  const tipIcon = document.createElement('span');
  tipIcon.className = 'tip-icon';
  tipIcon.textContent = '?';
  const tipText = document.createElement('span');
  tipText.className = 'tip-text';
  tipText.textContent = 'This score measures how evenly resources and settlement spots are distributed across the board. It combines resource pip variance (how equal each resource\u2019s total probability is) with vertex analysis (how fair individual settlement locations are). Actual gameplay will vary due to dice rolls, player strategy, and trading.';
  tip.appendChild(tipIcon);
  tip.appendChild(tipText);
  balanceEl.appendChild(tip);

  // Score breakdown chips — show sub-ratings instead of raw numbers
  function subLabel(v, thresholds) {
    if (v < thresholds[0]) return 'Even';
    if (v < thresholds[1]) return 'Slight spread';
    return 'Uneven';
  }
  const breakdown = document.createElement('div');
  breakdown.className = 'score-breakdown';
  const resItem = document.createElement('span');
  resItem.className = 'breakdown-item';
  resItem.textContent = 'Resource spread: ' + subLabel(score.resourceVariance, [1.5, 4]);
  breakdown.appendChild(resItem);
  const vtxItem = document.createElement('span');
  vtxItem.className = 'breakdown-item';
  vtxItem.textContent = 'Settlement quality: ' + subLabel(score.vertexSpread, [6, 12]);
  breakdown.appendChild(vtxItem);
  if (score.vertexData && score.vertexData.deadZones > 0) {
    const dzItem = document.createElement('span');
    dzItem.className = 'breakdown-item breakdown-warn';
    dzItem.textContent = score.vertexData.deadZones + ' weak spot' + (score.vertexData.deadZones > 1 ? 's' : '');
    breakdown.appendChild(dzItem);
  }
  balanceEl.appendChild(breakdown);

  // Port proximity analysis
  const portAnalysis = analyzePortProximity(board, currentPorts);
  if (portAnalysis.length > 0) {
    const portDiv = document.createElement('div');
    portDiv.className = 'port-analysis';
    const portLabel = document.createElement('div');
    portLabel.className = 'port-label';
    portLabel.textContent = '2:1 Port Placement';
    portDiv.appendChild(portLabel);
    const portNote = document.createElement('div');
    portNote.className = 'port-note';
    portNote.textContent = '3:1 ports work with any resource so placement doesn\u2019t matter';
    portDiv.appendChild(portNote);
    const portChips = document.createElement('div');
    portChips.className = 'port-chips';
    const iconMap = {lumber:'\u{1F332}', wool:'\u{1F411}', grain:'\u{1F33E}', brick:'\u{1F9F1}', ore:'\u26F0\uFE0F'};
    for (const p of portAnalysis) {
      const chip = document.createElement('span');
      chip.className = 'port-chip' + (p.useful ? ' port-good' : ' port-bad');
      chip.textContent = (iconMap[p.resourceType] || '') + ' ' + (p.useful ? 'Nearby' : 'Far');
      portChips.appendChild(chip);
    }
    portDiv.appendChild(portChips);
    document.getElementById('vertexStats').appendChild(portDiv);
  }

  if (lastGenerateUsedFallback) {
    const warn = document.createElement('div');
    warn.style.cssText = 'margin-top:8px;padding:8px 12px;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;font-size:0.8rem;color:#856404;';
    warn.textContent = 'Could not satisfy all constraints after 1000 attempts. Some rules may be violated.';
    balanceEl.appendChild(warn);
  }
}

document.getElementById('chkWeighted').addEventListener('change', generate);

// Initial generate
generate();
</script>
